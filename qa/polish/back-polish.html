<style id="polish-v1-style">/* polish 2026-11-17: shop card shows what a visitor needs first; quick category chips; share link. Nothing is removed from the data. */
#card>div:first-of-type{order:1}#card>#cMeta{order:2}#card>.foot{order:3}#card>.real-place{order:4}#card>#hours{order:5}#card>#hoursMore{order:6}#card>#cInfo{order:7}#card>#cGrp{order:8}#card>.btn,#card>#photo-comparison{order:9}#card>#cSrc{order:10}
#card>.real-place.no-photo{display:none}
#hours:not(.all) tr:not(.today){display:none}
#hoursMore,#cInfo li.fid{font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
#hoursMore{align-self:flex-start;background:none;border:0;padding:0;margin-top:-4px;text-decoration:underline;text-underline-offset:3px}
#cInfo li.fid{list-style:none;margin-left:-18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cInfo li.fid::before{content:"▸ "}#cInfo li.fid.all{white-space:normal}#cInfo li.fid.all::before{content:"▾ "}
.pk-filter{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.pk-filter::-webkit-scrollbar{display:none}
.pk-filter button{flex:none!important;white-space:nowrap;padding:7px 11px!important}
.pk-filter button.qk{border-color:var(--line)}.pk-filter button.qk[aria-pressed=true]{background:var(--accent,#ff8a2b);border-color:var(--accent,#ff8a2b);color:#1a1205}
@media (min-width:761px){.pk-filter button.qk{display:none}.pk-filter button{flex:1!important}}
body.pl-loading #labels{visibility:hidden}
body.pl-loading::before{content:"หลัง มจพ. 3D";position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding-bottom:40px;font:700 22px/1.3 system-ui,sans-serif;color:#e8eef5;background:radial-gradient(circle at 50% 40%,#1d2a36,#0e141b 70%);pointer-events:none}
body.pl-loading::after{content:"";position:fixed;left:50%;top:calc(50% + 14px);z-index:4;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:3px solid #ffffff2e;border-top-color:#ff8a2b;animation:plspin .9s linear infinite;pointer-events:none}
@keyframes plspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){body.pl-loading::after{animation:none}}
</style>
<script id="polish-v1">/* polish 2026-11-17 (see the style block above). Runs last, after every other card and filter script. */
(function(){if(typeof select!=='function'||typeof D==='undefined'||typeof pins==='undefined')return;
 const card=document.getElementById('card'),hours=document.getElementById('hours'),foot=card.querySelector('.foot');
 /* ---- card: today's hours first, the full week and the building evidence line on demand ---- */
 const more=document.createElement('button');more.type='button';more.id='hoursMore';hours.after(more);
 const setWeek=all=>{hours.classList.toggle('all',all);more.textContent=all?'ซ่อนเวลาวันอื่น':'ดูเวลาเปิด-ปิดทั้งสัปดาห์';more.setAttribute('aria-expanded',String(all));};
 more.onclick=()=>setWeek(!hours.classList.contains('all'));
 document.getElementById('cInfo').addEventListener('click',e=>{const li=e.target.closest('li.fid');if(li)li.classList.toggle('all');});
 /* ---- share: a link that opens this place ---- */
 const share=document.createElement('button');share.type='button';share.className='btn';share.id='cShare';share.textContent='แชร์';foot.append(share);
 const keyOf=p=>p.pid||p.n,linkOf=p=>location.origin+location.pathname+'#place='+encodeURIComponent(keyOf(p));
 share.onclick=async()=>{const p=selId!=null&&D.P[selId];if(!p)return;const url=linkOf(p);
  try{if(navigator.share){await navigator.share({title:p.n,text:p.n+' · หลัง มจพ.',url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์ของ "'+p.n.replace(/[<&]/g,'')+'" แล้ว',2500);}catch(e){prompt('คัดลอกลิงก์นี้',url);}};
 const tidy=()=>{const place=selId!=null&&!card.hidden;share.hidden=!place;more.hidden=hours.hidden||hours.rows.length<2;setWeek(false);
  const mark=()=>card.querySelectorAll('.real-place').forEach(s=>s.classList.toggle('no-photo',!s.querySelector('img,figure,.photo-failure')));mark();setTimeout(mark,0);};
 const sel=select;select=function(){const r=sel.apply(this,arguments);tidy();return r;};
 if(typeof showExtra==='function'){const se=showExtra;showExtra=function(){const r=se.apply(this,arguments);tidy();return r;};}
 const openHash=()=>{const m=/place=([^&]+)/.exec(location.hash);if(!m)return;let k;try{k=decodeURIComponent(m[1]);}catch(e){return;}
  const i=D.P.findIndex(p=>p.pid===k);const j=i>=0?i:D.P.findIndex(p=>p.n===k);if(j>=0)select(j,true);};
 addEventListener('hashchange',openHash);openHash();
 /* ---- quick chips beside the parking buttons (phone): show one category only; tap again for everything ---- */
 const bar=document.querySelector('#side .pk-filter'),catsEl=document.getElementById('cats');
 if(bar&&catsEl&&typeof on!=='undefined'){
  const keys=Object.keys(CATS).filter(k=>D.P.some(p=>p.c===k)),menuChip=k=>catsEl.children[keys.indexOf(k)+1],openChip=catsEl.children[0];
  const short={food:'อาหาร',cafe:'คาเฟ่',mart:'สะดวกซื้อ',dorm:'หอพัก',pharmacy:'ร้านยา',laundry:'ซักผ้า',copy:'ปริ้นงาน',bar:'บาร์',bus:'รถเมล์'};
  const onlyKey=()=>{const a=keys.filter(k=>on[k]);return a.length===1?a[0]:null;},qk={};
  const mk=(html,fn)=>{const b=document.createElement('button');b.type='button';b.className='qk';b.setAttribute('aria-pressed','false');b.innerHTML=html;b.onclick=fn;return b;};
  const clearParkingSearch=()=>{if([...bar.querySelectorAll('button[data-w]')].some(b=>b.dataset.w===q.value)){q.value='';q.dispatchEvent(new Event('input'));}};
  const qOpen=mk('🕒 เปิดอยู่',()=>{clearParkingSearch();openChip.click();sync();});
  const sync=()=>{const o=onlyKey();keys.forEach(k=>{const c=menuChip(k);if(c)c.setAttribute('aria-pressed',String(!!on[k]));if(qk[k])qk[k].setAttribute('aria-pressed',String(o===k));});qOpen.setAttribute('aria-pressed',openChip.getAttribute('aria-pressed'));};
  const first=bar.firstChild;bar.insertBefore(qOpen,first);
  Object.keys(short).forEach((k,n)=>{if(!keys.includes(k))return;const b=qk[k]=mk(CATS[k].ic+' '+short[k],()=>{clearParkingSearch();const was=onlyKey()===k;keys.forEach(c=>on[c]=was||c===k);sync();refresh();
    if(!was)toast(CATS[k].th+' '+pins.filter(pn=>pn.cat===k).length+' แห่ง',1500);});
   if(n<4)bar.insertBefore(b,first);else bar.append(b);});
  /* a parking button searches every category, so bring them all back first */
  bar.querySelectorAll('button[data-w]').forEach(b=>b.addEventListener('click',()=>{if(keys.some(k=>!on[k])){keys.forEach(k=>on[k]=true);sync();}},true));
  catsEl.addEventListener('click',()=>setTimeout(sync,0));
  /* the parking script resets aria-pressed on every button in this bar after each refresh, so set ours again after it */
  const r1=refresh;refresh=function(){r1();sync();};q.addEventListener('input',sync);sync();}
 window.__polish={linkOf,openHash};
})();
</script>
